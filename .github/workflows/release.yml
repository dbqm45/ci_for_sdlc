name: Release image

# Builds the Docker image once, smoke-tests it and publishes it to GitHub Container Registry
# (ghcr.io/dbqm45/ci_for_sdlc, private like the repository). Run it locally with
# `docker compose pull && docker compose up -d` (docs/LOCAL-ENVIRONMENT.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ci-sdlc:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 127.0.0.1:4317:4317 -e CI_ADMIN_TOKEN=smoke-token ci-sdlc:candidate
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4317/api/health && break
            [ "$i" = 30 ] && { docker logs smoke; exit 1; }
            sleep 2
          done
          curl -fsS http://127.0.0.1:4317/ | grep -q '<div id="root">'
          # Requests reach the container through Docker's network, so a change without the token is refused...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4317/api/analyze)
          [ "$code" = 401 ] || { echo "expected 401 without token, got $code"; exit 1; }
          # ...and accepted with it.
          curl -fsS -X POST -H 'Authorization: Bearer smoke-token' http://127.0.0.1:4317/api/analyze > /dev/null

      - name: Container logs
        if: failure()
        run: docker logs smoke

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      # GHCR for a private repository on GitHub Free holds 500 MB; keep only the most recent images.
      - name: Prune old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 6
