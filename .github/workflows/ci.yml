name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch / PR: a newer push cancels the run that is still queued or running.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres storage tests (F5, packages/server/test/postgres.test.ts). The passwords are throwaway values of a
    # container that lives for this job only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_admin" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_TEST_DATABASE_URL: postgres://ci_app:ci-throwaway@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v7
      # Row-level security does not apply to a superuser: the tests use a plain role that owns its database.
      - name: Database role for the Postgres tests
        run: |
          psql "postgres://ci_admin:ci-throwaway@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "create role ci_app login password 'ci-throwaway'" -c "create database ci_test owner ci_app"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Conventional Commits and SemVer helpers behind the PR title check and `npm run release`.
      - run: npm run test:scripts
      - name: Copies of the pdi contract match their pinned source (scripts/pdi-contract.json)
        run: npm run contract:check
      # Unit tests with coverage; includes the API contract test (packages/server/contracts/openapi.json).
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Critical paths first (@smoke), so a broken build fails in about a minute.
      - name: E2E smoke
        run: npm run test:e2e:smoke
      # Full e2e on Chromium, including accessibility (@a11y). Cross-browser and visual run nightly.
      - name: E2E full
        run: npm run test:e2e
      # Live mode: the real connectors against local Jira, Confluence and Figma mocks, with dummy tokens only.
      - name: E2E live on API mocks
        run: npm run test:e2e:live-mock
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-live-mock/
          retention-days: 7
