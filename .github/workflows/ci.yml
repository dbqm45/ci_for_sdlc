name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch / PR: a newer push cancels the run that is still queued or running.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests with coverage; includes the API contract test (packages/server/contracts/openapi.json).
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Critical paths first (@smoke), so a broken build fails in about a minute.
      - name: E2E smoke
        run: npm run test:e2e:smoke
      # Full e2e on Chromium, including accessibility (@a11y). Cross-browser and visual run nightly.
      - name: E2E full
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
