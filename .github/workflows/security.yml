name: Security

# Dependency audit. CodeQL / code scanning is not available for private repositories on GitHub Free,
# so this covers known vulnerabilities in npm packages; Dependabot (.github/dependabot.yml) proposes the updates.
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'packages/*/package.json']
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runtime dependencies (what ships in the image) must be free of high and critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      # Development tools (vitest, playwright, stryker, …) never ship in the image, but run in CI with its token:
      # high and critical advisories block, moderate ones are only reported.
      - name: npm audit (all dependencies, high and critical)
        run: npm audit --audit-level=high
      - name: npm audit (all dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=moderate
