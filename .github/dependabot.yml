version: 2
# PR titles follow Conventional Commits (docs/RELEASING.md): build(deps): / build(deps-dev): / ci(deps): …
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # One PR for all minor/patch updates; majors arrive separately so they can be reviewed one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime (22: CI, Dockerfile); newer types would allow APIs Node 22 lacks.
      # Raise together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
